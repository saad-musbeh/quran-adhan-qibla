name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust toolchain and components
        run: rustup show
      - run: npm ci
      - name: TypeScript and Rust checks
        run: npm run check
      - name: Export iOS and Android JavaScript bundles
        run: npm run export:mobile
