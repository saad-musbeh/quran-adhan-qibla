name: iOS native build

on:
  push:
    branches: [main, codex/reader-polish, codex/test-0.4.0, codex/tablet-location]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_run:
        description: 'Inspect an existing UI result instead of rebuilding'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.diagnostic_run || 'build' }}
  cancel-in-progress: true

jobs:
  previous-diagnostics:
    if: ${{ inputs.diagnostic_run != '' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: ios-ui-checks
          run-id: ${{ inputs.diagnostic_run }}
          github-token: ${{ github.token }}
          path: previous-ui
      - name: Export previous simulator diagnostics
        run: |
          mkdir -p previous-diagnostics
          xcrun xcresulttool get test-results summary --path previous-ui/ios-ui.xcresult > previous-diagnostics/summary.json
          xcrun xcresulttool export diagnostics --path previous-ui/ios-ui.xcresult --output-path previous-diagnostics
          python3 - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('previous-diagnostics')
          print((root/'summary.json').read_text())
          for path in root.rglob('*'):
            if path.is_file() and path.suffix in ('.ips','.crash','.txt','.log'):
              report=path.read_text(errors='replace')
              if path.suffix in ('.ips','.crash') and 'QuranAdhanQibla' in report:
                print(str(path)+'\n'+report[:40000])
              else:
                lines=[line for line in report.splitlines() if any(term in line for term in ('RCTFatal','Unhandled JS Exception','Terminating app','NSException','Fatal error','QuranAdhanQibla crashed'))]
                if lines: print(str(path)+'\n'+'\n'.join(lines)[:20000])
          for archive in pathlib.Path('previous-diagnostics').rglob('*.zip'):
            with zipfile.ZipFile(archive) as bundle:
              for name in bundle.namelist():
                if name.endswith(('.ips','.crash')):
                  report=bundle.read(name).decode('utf-8',errors='replace')
                  if 'QuranAdhanQibla' in report:
                    print(name+'\n'+report[:40000])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-previous-diagnostics
          path: previous-diagnostics
          retention-days: 7
  simulator:
    if: ${{ !inputs.diagnostic_run }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and apply the iOS audio patch
        run: npm ci --include=dev
      - name: Create iPhone simulator
        run: |
          QURAN_SIMULATOR="$(python3 - <<'PY'
          import json, subprocess, os
          def sim(*args): return subprocess.check_output(['xcrun', 'simctl', *args], text=True)
          runtimes=json.loads(sim('list','runtimes','--json'))['runtimes']
          runtime=max((r for r in runtimes if r.get('isAvailable') and '.iOS-' in r['identifier']), key=lambda r:tuple(map(int,r['version'].split('.'))))
          types=json.loads(sim('list','devicetypes','--json'))['devicetypes']
          phones=[t for t in types if 'SimDeviceType.iPhone-' in t['identifier']]
          device=next((t for t in phones if t['name']=='iPhone 17 Pro'), phones[0])
          identifier=sim('create','Quran UI checks',device['identifier'],runtime['identifier']).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('QURAN_SIMULATOR='+identifier+'\n')
          print(identifier)
          PY
          )"
          xcrun simctl boot "$QURAN_SIMULATOR"
          open -a Simulator
      - name: Build Rust device and simulator libraries
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          npm run rust:ios
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Compile a bundled simulator app without signing
        run: |
          set -o pipefail
          xcodebuild -workspace ios/QuranAdhanQibla.xcworkspace \
            -scheme QuranAdhanQibla -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath target/ios-build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee target/ios-build.log | xcbeautify
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            target/ios-build/Build/Products/Release-iphonesimulator/QuranAdhanQibla.app \
            target/quran-adhan-qibla-ios-simulator.zip
      - name: Add native UI tests to the generated project
        run: ruby scripts/prepare-ios-ui-tests.rb
      - name: Emulate iPad portrait and landscape
        run: |
          set -o pipefail
          QURAN_IPAD="$(python3 - <<'PYIPAD'
          import json,subprocess
          def sim(*args):return subprocess.check_output(['xcrun','simctl',*args],text=True)
          runtimes=json.loads(sim('list','runtimes','--json'))['runtimes']
          runtime=max((r for r in runtimes if r.get('isAvailable') and '.iOS-' in r['identifier']),key=lambda r:tuple(map(int,r['version'].split('.'))))
          types=json.loads(sim('list','devicetypes','--json'))['devicetypes']
          device=next(t for t in types if 'SimDeviceType.iPad-Pro-' in t['identifier'])
          print(sim('create','Quran tablet checks',device['identifier'],runtime['identifier']).strip())
          PYIPAD
          )"
          xcrun simctl boot "$QURAN_IPAD"
          xcrun simctl bootstatus "$QURAN_IPAD" -b
          xcrun simctl ui "$QURAN_IPAD" appearance dark
          xcodebuild test -workspace ios/QuranAdhanQibla.xcworkspace \
            -scheme QuranAdhanQibla -configuration Release \
            -destination "platform=iOS Simulator,id=$QURAN_IPAD" \
            -only-testing:QuranUITests/QuranUITests/testTabletMainMenuAndLandscapeReading \
            -derivedDataPath target/ios-build -resultBundlePath target/ipad-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee target/ipad-ui.log | xcbeautify
          xcrun simctl shutdown "$QURAN_IPAD"
      - name: Run the app and native UI checks
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$QURAN_SIMULATOR" -b
          xcrun simctl ui "$QURAN_SIMULATOR" appearance dark
          xcrun simctl install "$QURAN_SIMULATOR" target/ios-build/Build/Products/Release-iphonesimulator/QuranAdhanQibla.app
          QURAN_TEST_CONTAINER="$(xcrun simctl get_app_container "$QURAN_SIMULATOR" org.saadmusbeh.quranadhanqibla data)" python3 - <<'PY'
          # Test downloads live only in the simulator's private user storage.
          # No recitation MP3 is bundled or uploaded as an artifact.
          import os, pathlib, urllib.request
          directory=pathlib.Path(os.environ['QURAN_TEST_CONTAINER'])/'Documents/quran-audio/ghamdi/001'
          directory.mkdir(parents=True,exist_ok=True)
          for verse in range(1,8):
            filename=f'001{verse:03d}.mp3'
            with urllib.request.urlopen('https://everyayah.com/data/Ghamadi_40kbps/'+filename,timeout=30) as response:
              if response.status!=200: raise RuntimeError('Test audio download failed')
              (directory/filename).write_bytes(response.read())
          PY
          xcodebuild test -workspace ios/QuranAdhanQibla.xcworkspace \
            -scheme QuranAdhanQibla -configuration Release \
            -destination "platform=iOS Simulator,id=$QURAN_SIMULATOR" \
            -derivedDataPath target/ios-build -resultBundlePath target/ios-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee target/ios-ui.log | xcbeautify
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d target/ios-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path target/ios-ui.xcresult --output-path target/ios-screenshots
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-ui-checks
          path: |
            target/ios-ui.log
            target/ipad-ui.log
            target/ipad-ui.xcresult
            target/ios-ui.xcresult
            target/ios-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: ios-simulator
          path: target/quran-adhan-qibla-ios-simulator.zip
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-build-log
          path: target/ios-build.log
          if-no-files-found: ignore
          retention-days: 14
