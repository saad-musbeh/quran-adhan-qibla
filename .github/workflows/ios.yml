name: iOS native build

on:
  push:
    branches: [main, codex/reader-polish, codex/tablet-location, codex/release-0.6.0, codex/salawat-reminder-controls]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_run:
        description: 'Inspect an existing UI result instead of rebuilding'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    if: ${{ !inputs.diagnostic_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - name: Check TypeScript and the iOS test harness before the Mac build
        run: npm run typecheck && npm run test:ios:harness
  previous-diagnostics:
    if: ${{ inputs.diagnostic_run != '' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: ios-ui-checks
          run-id: ${{ inputs.diagnostic_run }}
          github-token: ${{ github.token }}
          path: previous-ui
      - name: Export previous simulator diagnostics
        run: |
          mkdir -p previous-diagnostics
          while IFS= read -r result; do
            name="$(basename "$(dirname "$result")")-$(basename "$result" .xcresult)"
            xcrun xcresulttool get test-results summary --path "$result" > "previous-diagnostics/$name-summary.json" || true
            xcrun xcresulttool export diagnostics --path "$result" --output-path "previous-diagnostics/$name" || true
          done < <(find previous-ui -type d -name '*.xcresult' -prune)
          python3 - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('previous-diagnostics')
          for summary in root.glob('*-summary.json'): print(str(summary)+'\n'+summary.read_text())
          for path in root.rglob('*'):
            if path.is_file() and path.suffix in ('.ips','.crash','.txt','.log'):
              report=path.read_text(errors='replace')
              if path.suffix in ('.ips','.crash') and 'QuranAdhanQibla' in report:
                print(str(path)+'\n'+report[:40000])
              else:
                lines=[line for line in report.splitlines() if any(term in line for term in ('RCTFatal','Unhandled JS Exception','Terminating app','NSException','Fatal error','QuranAdhanQibla crashed'))]
                if lines: print(str(path)+'\n'+'\n'.join(lines)[:20000])
          for archive in pathlib.Path('previous-diagnostics').rglob('*.zip'):
            with zipfile.ZipFile(archive) as bundle:
              for name in bundle.namelist():
                if name.endswith(('.ips','.crash')):
                  report=bundle.read(name).decode('utf-8',errors='replace')
                  if 'QuranAdhanQibla' in report:
                    print(name+'\n'+report[:40000])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-previous-diagnostics
          path: previous-diagnostics
          retention-days: 7
  simulator:
    needs: preflight
    if: ${{ !inputs.diagnostic_run }}
    # Queue expensive Mac work only; preflight must not wait behind an older build.
    concurrency:
      group: ios-${{ github.ref }}-build
      cancel-in-progress: false
    runs-on: macos-26
    # Compile once, then run isolated iPhone/iPad checks without rebuilding.
    timeout-minutes: 90
    env:
      CI: '1'
      NODE_ENV: production
      CARGO_TARGET_DIR: target/rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and apply the iOS audio patch
        run: npm ci --include=dev
      - name: Check native source syntax before compiling dependencies
        run: |
          ruby -c scripts/prepare-ios-ui-tests.rb
          xcrun swiftc -frontend -parse scripts/ios/QuranUITests.swift modules/islamic-core/ios/*.swift node_modules/expo-audio/ios/AudioPlaylist.swift
      - name: Prepare sourced audio fixtures before the native build
        timeout-minutes: 5
        run: node scripts/ios-ui-tests.mjs --prepare-fixtures
      - name: Initialize iPad before compiling dependencies
        # Finish and shut down the iPad before booting the iPhone.
        # Avoid concurrent first-boot migrations on the hosted Mac runner.
        timeout-minutes: 5
        run: |
          QURAN_IPAD="$(python3 - <<'PYIPAD'
          import json,subprocess,os
          def sim(*args):return subprocess.check_output(['xcrun','simctl',*args],text=True)
          runtimes=json.loads(sim('list','runtimes','--json'))['runtimes']
          runtime=max((r for r in runtimes if r.get('isAvailable') and '.iOS-' in r['identifier']),key=lambda r:tuple(map(int,r['version'].split('.'))))
          types=json.loads(sim('list','devicetypes','--json'))['devicetypes']
          device=next(t for t in types if 'SimDeviceType.iPad-Pro-' in t['identifier'])
          identifier=sim('create','Quran tablet checks',device['identifier'],runtime['identifier']).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('QURAN_IPAD='+identifier+'\n')
          print(identifier)
          PYIPAD
          )"
          xcrun simctl boot "$QURAN_IPAD"
          xcrun simctl bootstatus "$QURAN_IPAD" -b
          xcrun simctl shutdown "$QURAN_IPAD"
      - name: Create iPhone simulator
        run: |
          QURAN_SIMULATOR="$(python3 - <<'PY'
          import json, subprocess, os
          def sim(*args): return subprocess.check_output(['xcrun', 'simctl', *args], text=True)
          runtimes=json.loads(sim('list','runtimes','--json'))['runtimes']
          runtime=max((r for r in runtimes if r.get('isAvailable') and '.iOS-' in r['identifier']), key=lambda r:tuple(map(int,r['version'].split('.'))))
          types=json.loads(sim('list','devicetypes','--json'))['devicetypes']
          phones=[t for t in types if 'SimDeviceType.iPhone-' in t['identifier']]
          device=next((t for t in phones if t['name']=='iPhone 17 Pro'), phones[0])
          identifier=sim('create','Quran UI checks',device['identifier'],runtime['identifier']).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('QURAN_SIMULATOR='+identifier+'\n')
          print(identifier)
          PY
          )"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$QURAN_SIMULATOR"
          open -a Simulator
      - uses: Swatinem/rust-cache@v2
        with:
          # Xcode builds/results must never be restored from the Rust cache.
          prefix-key: v1-ios-native-rust
          workspaces: '. -> target/rust'
      - name: Build Rust device and simulator libraries
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          npm run rust:ios
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json', 'app.json', 'ios/Podfile', 'ios/Podfile.properties.json', 'modules/islamic-core/ios/*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Add native UI tests to the generated project
        run: ruby scripts/prepare-ios-ui-tests.rb
      - name: Compile the bundled simulator app and UI tests once
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -workspace ios/QuranAdhanQibla.xcworkspace \
            -scheme QuranAdhanQibla -configuration Release \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$QURAN_SIMULATOR" \
            -derivedDataPath target/ios-build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee target/ios-build.log | xcbeautify
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            target/ios-build/Build/Products/Release-iphonesimulator/QuranAdhanQibla.app \
            target/quran-adhan-qibla-ios-simulator.zip
      # Preserve the installable simulator app even when a later UI test fails.
      - uses: actions/upload-artifact@v6
        with:
          name: ios-simulator
          path: target/quran-adhan-qibla-ios-simulator.zip
          retention-days: 14
      - name: Check testing languages and Quran repeat controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$QURAN_SIMULATOR" -b
          node scripts/ios-ui-tests.mjs "$QURAN_SIMULATOR" polish 2>&1 | xcbeautify
      - name: Run the iPhone native UI checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcrun simctl ui "$QURAN_SIMULATOR" appearance dark
          node scripts/ios-ui-tests.mjs "$QURAN_SIMULATOR" iphone 2>&1 | xcbeautify
      - name: Emulate iPad portrait and landscape
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcrun simctl shutdown "$QURAN_SIMULATOR"
          trap 'xcrun simctl shutdown "$QURAN_IPAD"' EXIT
          xcrun simctl boot "$QURAN_IPAD"
          xcrun simctl bootstatus "$QURAN_IPAD" -b
          xcrun simctl ui "$QURAN_IPAD" appearance dark
          node scripts/ios-ui-tests.mjs "$QURAN_IPAD" ipad 2>&1 | xcbeautify
      - name: Export UI summaries and screenshots
        if: always()
        run: |
          mkdir -p target/ios-screenshots
          for result in target/ios-ui-results/*/*.xcresult; do
            if [ ! -d "$result" ]; then continue; fi
            name="$(basename "$(dirname "$result")")-$(basename "$result" .xcresult)"
            xcrun xcresulttool get test-results summary --path "$result" > "target/$name-summary.json" || true
            xcrun xcresulttool export attachments --path "$result" --output-path "target/ios-screenshots/$name" || true
            xcrun xcresulttool export diagnostics --path "$result" --output-path "target/ios-diagnostics/$name" || true
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-ui-checks
          path: |
            target/ios-ui-results
            target/ios-screenshots
            target/ios-diagnostics
            target/*-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-build-log
          path: target/ios-build.log
          if-no-files-found: ignore
          retention-days: 14
