name: iOS native build

on:
  push:
    branches: [codex/reader-polish, codex/test-0.4.0]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and apply the iOS audio patch
        run: npm ci --include=dev
      - name: Build Rust device and simulator libraries
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          npm run rust:ios
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Compile a bundled simulator app without signing
        run: |
          set -o pipefail
          xcodebuild -workspace ios/QuranAdhanQibla.xcworkspace \
            -scheme QuranAdhanQibla -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath target/ios-build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee target/ios-build.log | xcbeautify
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            target/ios-build/Build/Products/Release-iphonesimulator/QuranAdhanQibla.app \
            target/quran-adhan-qibla-ios-simulator.zip
      - name: Add native UI tests to the generated project
        run: ruby scripts/prepare-ios-ui-tests.rb
      - name: Create iPhone simulator
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          def sim(*args): return subprocess.check_output(['xcrun', 'simctl', *args], text=True)
          runtimes=json.loads(sim('list','runtimes','--json'))['runtimes']
          runtime=max((r for r in runtimes if r.get('isAvailable') and '.iOS-' in r['identifier']), key=lambda r:tuple(map(int,r['version'].split('.'))))
          types=json.loads(sim('list','devicetypes','--json'))['devicetypes']
          phones=[t for t in types if 'SimDeviceType.iPhone-' in t['identifier']]
          device=next((t for t in phones if t['name']=='iPhone 17 Pro'), phones[0])
          identifier=sim('create','Quran UI checks',device['identifier'],runtime['identifier']).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('QURAN_SIMULATOR='+identifier+'\n')
          PY
          open -a Simulator
      - name: Run the app and native UI checks
        run: |
          set -o pipefail
          xcrun simctl boot "$QURAN_SIMULATOR"
          xcrun simctl bootstatus "$QURAN_SIMULATOR" -b
          xcrun simctl ui "$QURAN_SIMULATOR" appearance dark
          xcrun simctl install "$QURAN_SIMULATOR" target/ios-build/Build/Products/Release-iphonesimulator/QuranAdhanQibla.app
          QURAN_TEST_CONTAINER="$(xcrun simctl get_app_container "$QURAN_SIMULATOR" org.saadmusbeh.quranadhanqibla data)" python3 - <<'PY'
          # Test downloads live only in the simulator's private user storage.
          # No recitation MP3 is bundled or uploaded as an artifact.
          import os, pathlib, urllib.request
          directory=pathlib.Path(os.environ['QURAN_TEST_CONTAINER'])/'Documents/quran-audio/ghamdi/001'
          directory.mkdir(parents=True,exist_ok=True)
          for verse in range(1,8):
            filename=f'001{verse:03d}.mp3'
            with urllib.request.urlopen('https://everyayah.com/data/Ghamadi_40kbps/'+filename,timeout=30) as response:
              if response.status!=200: raise RuntimeError('Test audio download failed')
              (directory/filename).write_bytes(response.read())
          PY
          xcodebuild test -workspace ios/QuranAdhanQibla.xcworkspace \
            -scheme QuranAdhanQibla -configuration Release \
            -destination "platform=iOS Simulator,id=$QURAN_SIMULATOR" \
            -derivedDataPath target/ios-build -resultBundlePath target/ios-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee target/ios-ui.log | xcbeautify
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d target/ios-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path target/ios-ui.xcresult --output-path target/ios-screenshots
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-ui-checks
          path: |
            target/ios-ui.log
            target/ios-ui.xcresult
            target/ios-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: ios-simulator
          path: target/quran-adhan-qibla-ios-simulator.zip
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-build-log
          path: target/ios-build.log
          if-no-files-found: ignore
          retention-days: 14
