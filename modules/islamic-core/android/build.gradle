plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.islamiccore'
version = '0.1.0'

android {
  namespace "expo.modules.islamiccore"
  sourceSets.main.assets.srcDirs += file('../assets')
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
}
