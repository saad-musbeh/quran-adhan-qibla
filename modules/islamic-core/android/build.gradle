plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.islamiccore'
version = '0.1.0'

android {
  namespace "expo.modules.islamiccore"
  sourceSets.main.assets.srcDirs += file('../assets')
  testOptions {
    unitTests.includeAndroidResources = true
  }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
}

repositories {
  maven { url "$rootDir/../node_modules/expo-audio/local-maven-repo" }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'expo.modules.audio:expo.modules.audio:57.0.5'
  def androidxMedia3Version = "1.9.0"
  implementation "androidx.media3:media3-session:$androidxMedia3Version"
  implementation "androidx.media3:media3-exoplayer:$androidxMedia3Version"
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test:runner:1.7.0'
}
