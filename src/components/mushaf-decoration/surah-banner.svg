<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" role="img" aria-label="Empty ornamental surah heading banner">
  <title>Ornamental surah heading banner</title>
  <desc>Reusable blank center plate with symmetrical green and gold floral arabesque ends. No Quranic text is embedded.</desc>
  <defs>
    <g id="sprig">
      <path d="M0 50C18 38 20 18 39 10c-2 18-12 29-28 36 22-12 44-9 59 4-17 11-37 10-59 0 17 8 26 20 28 40C20 82 18 62 0 50Z" fill="#37644D" stroke="#B99A4D" stroke-width="1.6"/>
      <path d="M4 50 57 50M18 45 33 22M24 54 42 73" fill="none" stroke="#D3B66B" stroke-width="1.4"/>
      <circle cx="0" cy="50" r="4" fill="#C3A454"/>
    </g>
    <g id="rosette">
      <path d="M0-17 5-8 15-10 10 0 15 10 5 8 0 17-5 8-15 10-10 0-15-10-5-8Z" fill="#35634B" stroke="#B7984E" stroke-width="1.5"/>
      <circle r="5" fill="#D8C27D" stroke="#987B37" stroke-width="1.3"/>
      <circle r="1.8" fill="#386249"/>
    </g>
    <g id="panel">
      <path d="M20 50h80M22 31c21 0 22-19 43-19s22 19 43 19M22 69c21 0 22 19 43 19s22-19 43-19" fill="none" stroke="#B99A4D" stroke-width="2"/>
      <path d="M30 50 48 31 66 50 48 69ZM55 50 73 31 91 50 73 69Z" fill="none" stroke="#37644D" stroke-width="2"/>
      <use href="#rosette" x="48" y="31"/><use href="#rosette" x="48" y="69"/><use href="#rosette" x="73" y="50"/>
      <circle cx="22" cy="50" r="4" fill="#D3B66B"/><circle cx="98" cy="50" r="4" fill="#D3B66B"/>
    </g>
  </defs>
  <!-- Outer gilt double rule and softly scalloped center plate. -->
  <path d="M8 17 17 8h866l9 9v66l-9 9H17L8 83Z" fill="#D4C28F" stroke="#967632" stroke-width="2"/>
  <path d="M13 20 20 13h860l7 7v60l-7 7H20l-7-7Z" fill="#F4EFE0" stroke="#B89A4E" stroke-width="1.5"/>
  <path d="M278 12c-8 9-15 12-28 12H119v52h131c13 0 20 3 28 12M622 12c8 9 15 12 28 12h131v52H650c-13 0-20 3-28 12" fill="#EFE4C6" stroke="#B89A4E" stroke-width="2"/>
  <path d="M284 17c-10 10-15 13-29 13H127v40h128c14 0 19 3 29 13M616 17c10 10 15 13 29 13h128v40H645c-14 0-19 3-29 13" fill="none" stroke="#D3B66B" stroke-width="1.4"/>
  <!-- Mirrored floral panels frame a clear live text slot in the middle. -->
  <g transform="translate(10 0)"><use href="#panel" x="0" y="0"/><use href="#panel" x="99" y="0"/></g>
  <g transform="translate(890 0) scale(-1 1)"><use href="#panel" x="0" y="0"/><use href="#panel" x="99" y="0"/></g>
  <path d="M285 11v78M615 11v78" stroke="#B99A4D" stroke-width="1.5"/>
  <path d="M293 16v68M607 16v68" stroke="#D8C27D" stroke-width="1"/>
</svg>
